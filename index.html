<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MRBG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#ff00fe; --bg2: #390b32;
    --card-bg:#1f2530; --card-border:rgba(0,0,0,0.06);
    --shadow: 0 20px 50px rgba(80,60,10,0.18), 0 2px 8px rgba(80,60,10,0.10);
    --text:#f3e6b8; --text-soft:#cbb877;
    --stem:#4f7c34; --stem-dark:#375824;
    --petal-edge:#e0a300;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg1:#ff00fe; --bg2: #390b32;
      --card-bg:#1f2530; --card-border:rgba(255,255,255,0.08);
      --shadow: 0 20px 50px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.4);
      --text:#f3e6b8; --text-soft:#cbb877;
    }
  }
  :root[data-theme="dark"]{
    --bg1:#ff00fe; --bg2: #390b32;
    --card-bg:#1f2530; --card-border:rgba(255,255,255,0.08);
    --shadow: 0 20px 50px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.4);
    --text:#f3e6b8; --text-soft:#cbb877;
  }
  html,body{
    height:100%; margin:0;
    background: radial-gradient(circle at 50% 20%, var(--bg2), var(--bg1) 70%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:24px;
  }
  .card{
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 20px 20px 26px;
    width: 100%;
    max-width: 380px;
    text-align:center;
  }
  .stage{ width:100%; aspect-ratio: 400/520; }
  svg{ width:100%; height:100%; display:block; overflow:visible; }

  .caption{
    font-family:"Dancing Script", cursive;
    font-size: 2.1rem;
    color: var(--text);
    margin: 4px 0 2px;
    opacity:0;
    animation: fadeUp 1s ease-out forwards;
    animation-delay: 3.5s;
  }
  .subcaption{
    font-size: 0.85rem;
    color: var(--text-soft);
    letter-spacing:0.04em;
    opacity:0;
    animation: fadeUp 1s ease-out forwards;
    animation-delay: 3.8s;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .stem{
    fill:none; stroke: var(--stem-dark); stroke-width:6; stroke-linecap:round;
    stroke-dasharray:1; stroke-dashoffset:1;
    animation: draw 1.3s ease-out forwards;
    animation-delay:.1s;
  }
  .leaf{
    fill:#6f9c46; stroke: var(--stem-dark); stroke-width:1.5;
    stroke-dasharray:1; stroke-dashoffset:1; fill-opacity:0;
    animation: drawFill 1.2s ease-out forwards;
  }
  .leaf.l1{ animation-delay:.5s; }
  .leaf.l2{ animation-delay:.75s; }

  .petal{
    fill:url(#petalGrad);
    stroke: var(--petal-edge); stroke-width:1.5;
    stroke-dasharray:1; stroke-dashoffset:1; fill-opacity:0;
    animation: drawFill 1.15s ease-out forwards;
  }
  .p1{ animation-delay:1.0s; }
  .p2{ animation-delay:1.25s; }
  .p3{ animation-delay:1.5s; }
  .p4{ animation-delay:1.75s; }
  .p5{ animation-delay:2.0s; }
  .p6{ animation-delay:2.25s; }

  .spot{ fill:#c9760f; opacity:0; animation: fadeIn .6s ease-out forwards; }
  .p1 ~ .spot1{ animation-delay:1.9s; }

  .stamen{ opacity:0; transform-origin:200px 225px; animation: popIn .6s ease-out forwards; }
  .st1{animation-delay:3.05s;} .st2{animation-delay:3.12s;} .st3{animation-delay:3.19s;}
  .st4{animation-delay:3.26s;} .st5{animation-delay:3.33s;} .st6{animation-delay:3.40s;}

  #flowerGroup{
    transform-origin: 200px 230px;
    animation: sway 4.5s ease-in-out infinite alternate;
    animation-delay: 3.6s;
  }

  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes drawFill{
    0%{ stroke-dashoffset:1; fill-opacity:0; }
    65%{ stroke-dashoffset:0; fill-opacity:0; }
    100%{ stroke-dashoffset:0; fill-opacity:1; }
  }
  @keyframes fadeIn{ to{ opacity:1; } }
  @keyframes popIn{
    0%{ opacity:0; transform:scale(.3); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes sway{
    from{ transform: rotate(-1.6deg) translateY(0px); }
    to{ transform: rotate(1.6deg) translateY(-3px); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="stage">
      <svg viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="petalGrad" cx="50%" cy="85%" r="90%">
            <stop offset="0%" stop-color="#fff6c2"/>
            <stop offset="35%" stop-color="#ffe066"/>
            <stop offset="75%" stop-color="#ffc93c"/>
            <stop offset="100%" stop-color="#ffb300"/>
          </radialGradient>
        </defs>

        <path class="stem" d="M200,278 C 193,330 208,400 200,478" pathLength="1"/>

        <path class="leaf l1" pathLength="1"
          d="M200,340 C 150,335 110,355 90,395 C 130,400 175,385 200,352 Z"/>
        <path class="leaf l2" pathLength="1"
          d="M200,395 C 250,388 292,405 312,448 C 270,452 225,438 200,405 Z"/>

        <g id="flowerGroup">
          <g transform="translate(200,225) rotate(0)">
            <path class="petal p1" pathLength="1"
              d="M0,0 C -32,-32 -38,-96 0,-148 C 38,-96 32,-32 0,0 Z"/>
          </g>
          <g transform="translate(200,225) rotate(60)">
            <path class="petal p2" pathLength="1"
              d="M0,0 C -32,-32 -38,-96 0,-148 C 38,-96 32,-32 0,0 Z"/>
          </g>
          <g transform="translate(200,225) rotate(120)">
            <path class="petal p3" pathLength="1"
              d="M0,0 C -32,-32 -38,-96 0,-148 C 38,-96 32,-32 0,0 Z"/>
          </g>
          <g transform="translate(200,225) rotate(180)">
            <path class="petal p4" pathLength="1"
              d="M0,0 C -32,-32 -38,-96 0,-148 C 38,-96 32,-32 0,0 Z"/>
          </g>
          <g transform="translate(200,225) rotate(240)">
            <path class="petal p5" pathLength="1"
              d="M0,0 C -32,-32 -38,-96 0,-148 C 38,-96 32,-32 0,0 Z"/>
          </g>
          <g transform="translate(200,225) rotate(300)">
            <path class="petal p6" pathLength="1"
              d="M0,0 C -32,-32 -38,-96 0,-148 C 38,-96 32,-32 0,0 Z"/>
          </g>

          <g fill="#c9760f">
            <ellipse class="spot" cx="200" cy="205" rx="3" ry="5" style="animation-delay:2.0s"/>
            <ellipse class="spot" cx="191" cy="198" rx="2.5" ry="4" style="animation-delay:2.1s"/>
            <ellipse class="spot" cx="209" cy="198" rx="2.5" ry="4" style="animation-delay:2.2s"/>
            <ellipse class="spot" cx="196" cy="188" rx="2" ry="3.5" style="animation-delay:2.3s"/>
            <ellipse class="spot" cx="204" cy="188" rx="2" ry="3.5" style="animation-delay:2.3s"/>
          </g>

          <g stroke="#c99a2e" stroke-width="2.5" stroke-linecap="round">
            <g class="stamen st1"><line x1="200" y1="222" x2="176" y2="168"/><ellipse cx="174" cy="163" rx="7" ry="4" fill="#8a4b1e" transform="rotate(-40 174 163)"/></g>
            <g class="stamen st2"><line x1="200" y1="222" x2="222" y2="160"/><ellipse cx="224" cy="155" rx="7" ry="4" fill="#8a4b1e" transform="rotate(20 224 155)"/></g>
            <g class="stamen st3"><line x1="200" y1="222" x2="238" y2="192"/><ellipse cx="242" cy="188" rx="7" ry="4" fill="#8a4b1e" transform="rotate(55 242 188)"/></g>
            <g class="stamen st4"><line x1="200" y1="222" x2="228" y2="230"/><ellipse cx="233" cy="231" rx="7" ry="4" fill="#8a4b1e" transform="rotate(90 233 231)"/></g>
            <g class="stamen st5"><line x1="200" y1="222" x2="170" y2="228"/><ellipse cx="165" cy="228" rx="7" ry="4" fill="#8a4b1e" transform="rotate(90 165 228)"/></g>
            <g class="stamen st6"><line x1="200" y1="222" x2="200" y2="150"/><ellipse cx="200" cy="142" rx="8" ry="5" fill="#6e3a17"/></g>
          </g>
        </g>
      </svg>
    </div>
    <div class="caption">MRBG</div>
    <div class="subcaption">21-09-26</div>
  </div>
</body>
</html>
